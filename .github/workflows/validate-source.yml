name: Validate source baseline

on:
  pull_request:
    branches: [main, integrator/bootstrap-source]
  push:
    branches:
      - integrator/bootstrap-source

permissions:
  contents: read

jobs:
  python-and-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require complete Godot source
        run: |
          test -f game/project.godot || { echo "::error::Missing game/project.godot: full source import is not complete"; exit 1; }
          test -f game/scenes/terrain_showcase/terrain_showcase.tscn || { echo "::error::T089 showcase scene is missing"; exit 1; }
          test -f tools/validate.py || { echo "::error::Source validator is missing"; exit 1; }

      - name: Validate repository data
        run: python tools/validate.py

      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Syntax check for Python tooling
        run: python -m compileall -q tools tests

      - name: Reject unresolved asset rights in manifest
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import sys
          path = Path("licenses/manifest.csv")
          if not path.is_file():
              sys.exit("Missing licenses/manifest.csv")
          flags = ("belum diverifikasi", "konfirmasi pemilik")
          with path.open(encoding="utf-8-sig", newline="") as handle:
              unresolved = [r["file"] for r in csv.DictReader(handle)
                            if any(flag in (r.get("lisensi", "") + " " + r.get("catatan", "")).lower()
                                   for flag in flags)]
          if unresolved:
              for filename in unresolved:
                  print("::error::Unverified asset rights: " + filename)
              sys.exit(f"{len(unresolved)} assets need licensing review before merging")
          PY

# This job validates Python code and baseline file presence only.
# Godot runtime, shader rendering and Android hardware performance must be checked separately.
